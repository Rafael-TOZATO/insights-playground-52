<svg width="1200" height="350" viewBox="0 0 1200 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo -->
  <rect width="1200" height="350" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="310" rx="16" fill="#1f2937" fill-opacity="0.4" stroke="#374151" stroke-width="2"/>

  <!-- Linha de Brilho Superior -->
  <rect x="20" y="20" width="1160" height="4" fill="url(#glow)"/>

  <!-- Textos -->
  <text x="70" y="110" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="2">ATLAS INTELLIGENCE • SALES ANALYTICS</text>
  <text x="70" y="170" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800">Insights Playground & Dashboard</text>
  <text x="70" y="220" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="20">Plataforma interativa de inteligência de vendas, previsões e engenharia de dados.</text>

  <!-- Elemento Gráfico Animado (Indicador de Performance) -->
  <g transform="translate(950, 100)">
    <circle cx="75" cy="75" r="65" stroke="#374151" stroke-width="12" fill="none"/>
    <circle cx="75" cy="75" r="65" stroke="#10b981" stroke-width="12" fill="none" stroke-dasharray="400" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="400;100;400" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="75" y="85" fill="#ffffff" font-family="system-ui" font-size="24" font-weight="bold" text-anchor="middle">+27.0%</text>
  </g>
</svg>
